<!DOCTYPE html>
<html lang="en" class="h-full antialiased">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slideshows — AI Creative Studio & Promo Generator</title>
  <meta name="description" content="Generate images, videos, and viral phone slideshows for your campaigns." />
  <link rel="icon" type="image/png" href="/icon.png" />

  <!-- Typography: Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Core Original Next.js / Tailwind CSS Stylesheets -->
  <link rel="stylesheet" href="/css/3pamwr9vdiq4a.css" />
  <link rel="stylesheet" href="/css/1g9k315gb-cfd.css" />
  <link rel="stylesheet" href="/css/0g6k8ga_cdx79.css" />

  <!-- Tailwind CSS runtime utility support -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            heading: ['"Bricolage Grotesque"', 'system-ui', 'sans-serif'],
            sans: ['"Inter"', 'system-ui', 'sans-serif'],
            mono: ['"Geist Mono"', 'ui-monospace', 'monospace']
          },
          colors: {
            shell: '#e5e5ea',
            surface: '#f2f2f7',
            ink: '#111827',
            'ink-2': '#6b7280',
            quiet: '#9ca3af',
            ring: '#3b82f6',
            brand: '#2563eb'
          }
        }
      }
    };
  </script>

  <style>
    :root {
      --background: #fbfbfd;
      --foreground: #1d1d1f;
      --canvas: #f5f5f7;
      --surface: #f2f2f7;
      --shell: #e5e5ea;
      --border: #e5e5ea;
      --ring: #3b82f6;
      --brand: #2563eb;
      --brand-soft: #eff6ff;
      --ink: #111827;
      --ink-2: #6b7280;
      --quiet: #9ca3af;
      --font-heading: 'Bricolage Grotesque', sans-serif;
      --default-font-family: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      font-family: var(--default-font-family);
      background-color: var(--background);
      color: var(--foreground);
      -webkit-font-smoothing: antialiased;
    }

    .font-heading {
      font-family: var(--font-heading);
    }
  </style>
</head>
<body class="min-h-full bg-[#fbfbfd]">
  <div id="app"></div>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
